services:

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: 1000
        GID: 1000

    user: "1000:1000"

    volumes:
      - ./src:/var/www/html

    container_name: shopra_php

    working_dir: /var/www/html

    depends_on:
      - postgres

    ports:
      - "8000:8000"
      - "5173:5173"

  nginx:
    image: nginx:alpine

    container_name: shopra_nginx

    ports:
      - "80:80"

    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - php

  postgres:
    image: postgres:17

    container_name: shopra_postgres

    environment:
      POSTGRES_DB: shopra
      POSTGRES_USER: shopra
      POSTGRES_PASSWORD: secret

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: